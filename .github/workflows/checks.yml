name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: bash -n deploy/gce/*.sh
      - run: python3 -B -c "import ast; from pathlib import Path; ast.parse(Path('deploy/gce/upload-backup.py').read_text())"
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm contracts:check
      - run: pnpm contracts:test
        env:
          FOUNDRY_PROFILE: ci
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: |
            playwright-report/
            test-results/
          retention-days: 7
